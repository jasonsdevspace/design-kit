name: Release the prose check

# Releases the prose check when a tag such as prose-check-v0.1.0 is pushed, apart from the kit,
# whose release this never moves. The tag has to name a commit on main, match the version in the
# package's package.json, and have an entry in its changelog with no Unreleased entry left, or
# nothing is released. Every check CI runs, runs first.
#
# The publish uses npm's trusted publishing: the workflow proves who it is with an OpenID Connect
# token, so no npm token is stored anywhere, and each version carries provenance that links it to
# the commit and the run that built it. The version is staged, not released. npm holds it until
# Jason promotes it on the package page. A prerelease version, one with a hyphen, is staged under
# the "next" tag and marked as a prerelease on GitHub.
on:
    push:
        tags:
            - 'prose-check-v*'

permissions:
    contents: read

# A release's own jobs use no cache, so nothing a run on main kept reaches what it publishes. Its
# checks read the cache, as CI does, and the job among them that packs the release installs
# afresh from the lockfile.
cache-mode: none

# One release run for a tag at a time, so a tag pushed again while its run is still going never
# publishes beside it.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The cheap checks first, so a mistyped tag fails in seconds.
    agree:
        name: Tag, version and changelog
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # The tag names the version, the package declares it, and the changelog explains it.
            # All three have to agree, and the commit has to be on main, so nothing unreviewed is
            # ever released.
            - name: Check tag, version, changelog and branch
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  dir=packages/prose-check
                  version="${TAG#prose-check-v}"
                  declared=$(node -p "require('./$dir/package.json').version")
                  if [ "$version" != "$declared" ]; then
                      echo "the tag says $version but $dir/package.json says $declared"
                      exit 1
                  fi
                  if ! grep -qxF -- "## $version" "$dir/CHANGELOG.md"; then
                      echo "$dir/CHANGELOG.md has no entry for $version"
                      exit 1
                  fi
                  if grep -qiE '^##[[:space:]]+\[?unreleased\]?[[:space:]]*$' "$dir/CHANGELOG.md"; then
                      echo "$dir/CHANGELOG.md still has an Unreleased heading, which ## $version replaces"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "the tagged commit is not on main"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  case "$version" in
                      *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

    # A called workflow may ask for no more than its caller grants, and CI's deploy job asks for the
    # Pages permissions even though it never runs on a tag, so they are granted here or the run
    # fails at startup.
    checks:
        name: CI
        needs: agree
        cache-mode: read
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            pages: write
            id-token: write

    # The job that can publish does nothing else. It holds the token npm's trusted publishing asks
    # for, so it checks out only the Node version, restores no cache and installs nothing but a
    # pinned npm, without install scripts. What it publishes is the tarball CI packed and proved on
    # the oldest supported Node, and only when its checksum is the one that job reported.
    publish:
        name: Stage on npm
        needs: [agree, checks]
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        # The environment is what npm's trusted publisher is registered against, and it accepts a
        # deployment only from a release tag, `design-kit-v*` or `prose-check-v*`.
        environment: npm
        permissions:
            contents: read
            id-token: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            SHA256: ${{ needs.checks.outputs.prose-check-sha256 }}
        steps:
            # The one file the job reads, for the Node the project names. No code is checked out,
            # so none can run.
            - name: Read the Node version
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .nvmrc
                  sparse-checkout-cone-mode: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Trusted publishing and staging need an npm newer than the runner ships. Pinned, and
            # checked against the checksum npm's registry gives for that version before anything
            # installs it, so this job, which holds the token, runs only that npm. The same npm the
            # kit's release uses, raised with it by hand.
            - name: Use a pinned npm
              env:
                  NPM_VERSION: 12.2.1
                  NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
              run: |
                  tarball="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
                  curl -fsSL --retry 3 --retry-all-errors "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz" -o "$tarball"
                  got="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
                  if [ "$got" != "$NPM_INTEGRITY" ]; then
                      echo "npm $NPM_VERSION does not match its pinned checksum"
                      exit 1
                  fi
                  npm install -g --offline --ignore-scripts "$tarball"
                  npm --version

            - name: Download the packed prose check
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: prose-check-package
                  path: ${{ runner.temp }}/package

            # A version already on npm is left alone, and a version staged by an earlier run cannot
            # be told from one staged from other code, so this step stops on either rather than
            # guess. A run whose later step failed is repeated with "Re-run failed jobs".
            - name: Stage the version on npm with provenance
              run: |
                  page="https://www.npmjs.com/package/@jasonsdevspace/prose-check/v/$VERSION"
                  if npm view "@jasonsdevspace/prose-check@$VERSION" version >/dev/null 2>&1; then
                      echo "$VERSION is already on npm"
                      printf '### On npm\n\n[%s](%s) was already on npm, so nothing was staged.\n' "$VERSION" "$page" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  tarball="$RUNNER_TEMP/package/jasonsdevspace-prose-check-$VERSION.tgz"
                  if [ ! -f "$tarball" ]; then
                      echo "the packed prose check is not $VERSION"
                      ls "$RUNNER_TEMP/package"
                      exit 1
                  fi
                  # Any job in the run can replace an artifact, but none can change the checksum
                  # the oldest Node check reported, so a swapped tarball stops here.
                  if [ -z "$SHA256" ]; then
                      echo "the checks reported no checksum for the packed prose check"
                      exit 1
                  fi
                  echo "$SHA256  $tarball" | sha256sum -c -
                  tag=latest
                  [ "$PRERELEASE" = "true" ] && tag=next
                  npm stage publish "$tarball" --provenance --access public --tag "$tag"
                  printf '### Staged on npm\n\n`@jasonsdevspace/prose-check@%s` is staged under the `%s` tag with provenance, and goes live once it is promoted on npm. Its page will be [%s](%s).\n' "$VERSION" "$tag" "$page" "$page" >> "$GITHUB_STEP_SUMMARY"

    # A release on GitHub with the changelog entry as its notes, so the tag has a page a reader can
    # land on. Left alone if it exists. Its own job, so writing to the repository and publishing
    # to npm never share one.
    release:
        name: Release on GitHub
        needs: [agree, publish]
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=()
                  [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
                  package="$(jq -r .name packages/prose-check/package.json)"
                  export NOTES_LEAD="The prose check is [\`$package\`](https://www.npmjs.com/package/$package) on npm. Once this version is promoted there, install it with \`npm install --save-dev --save-exact $package@$VERSION\`."
                  scripts/github-release.sh "$TAG" "$VERSION" packages/prose-check/CHANGELOG.md \
                      "prose-check $VERSION" "${flags[@]}"
