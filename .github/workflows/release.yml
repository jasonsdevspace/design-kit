name: Release

# Releases the package when a tag such as design-kit-v0.1.0 is pushed. The tag has to name a commit
# on main, match the version in the package's package.json, and have an entry in its changelog, or
# nothing is released. Every check CI runs, runs first.
#
# The publish uses npm's trusted publishing: the workflow proves who it is with an OpenID Connect
# token, so no npm token is stored anywhere, and each version carries provenance that links it to
# the commit and the run that built it. The version is staged, not released. npm holds it until
# Jason promotes it on the package page, so a tag, a green run and a click are all needed before
# anyone can install it, and nothing that happens in CI alone can change what "latest" points at.
# A prerelease version, one with a hyphen, is staged under the "next" tag and marked as a
# prerelease on GitHub.
on:
    push:
        tags:
            - 'design-kit-v*'

permissions:
    contents: read

# One release run for a tag at a time, so a tag pushed again while its run is still going never
# publishes beside it.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The cheap checks first, so a mistyped tag fails in seconds.
    agree:
        name: Tag, version and changelog
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # The tag names the version, the package declares it, and the changelog explains it.
            # All three have to agree, and the commit has to be on main, so nothing unreviewed is
            # ever released.
            - name: Check tag, version, changelog and branch
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  dir=packages/design-kit
                  version="${TAG#design-kit-v}"
                  declared=$(node -p "require('./$dir/package.json').version")
                  if [ "$version" != "$declared" ]; then
                      echo "the tag says $version but $dir/package.json says $declared"
                      exit 1
                  fi
                  if ! grep -qxF -- "## $version" "$dir/CHANGELOG.md"; then
                      echo "$dir/CHANGELOG.md has no entry for $version"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "the tagged commit is not on main"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  case "$version" in
                      *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

    checks:
        name: CI
        needs: agree
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    # The job that can publish does nothing else. It holds the token npm's trusted publishing asks
    # for, so it checks out only the Node version, restores no cache and installs nothing but a
    # pinned npm, without install scripts. What it publishes is the tarball CI packed and proved on
    # the oldest supported Node, in a job with no more than read access, and only when its
    # checksum is the one that job reported.
    publish:
        name: Stage on npm
        needs: [agree, checks]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # The environment is what npm's trusted publisher is registered against, and it accepts a
        # deployment only from a design-kit tag.
        environment: npm
        permissions:
            contents: read
            id-token: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            SHA256: ${{ needs.checks.outputs.package-sha256 }}
        steps:
            # The one file the job reads, for the Node the project names. No code is checked out,
            # so none can run.
            - name: Read the Node version
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .nvmrc
                  sparse-checkout-cone-mode: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Trusted publishing and staging need an npm newer than the runner ships. Pinned, so
            # what publishes is the npm a release was proven on. Dependabot cannot see a version in
            # a script, so it is raised by hand, with a release, when npm changes how publishing
            # works.
            - name: Use a pinned npm
              run: npm install -g --ignore-scripts npm@12.2.1 && npm --version

            - name: Download the packed package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: design-kit-package
                  path: ${{ runner.temp }}/package

            # A version already on npm is left alone, so a run can be repeated after a later step
            # failed.
            - name: Stage the version on npm with provenance
              run: |
                  if npm view "@jasonsdevspace/design-kit@$VERSION" version >/dev/null 2>&1; then
                      echo "$VERSION is already on npm"
                      exit 0
                  fi
                  tarball="$RUNNER_TEMP/package/jasonsdevspace-design-kit-$VERSION.tgz"
                  if [ ! -f "$tarball" ]; then
                      echo "the packed package is not $VERSION"
                      ls "$RUNNER_TEMP/package"
                      exit 1
                  fi
                  # Any job in the run can replace an artifact, but none can change the checksum
                  # the oldest Node check reported, so a swapped tarball stops here.
                  if [ -z "$SHA256" ]; then
                      echo "the checks reported no checksum for the packed package"
                      exit 1
                  fi
                  echo "$SHA256  $tarball" | sha256sum -c -
                  tag=latest
                  [ "$PRERELEASE" = "true" ] && tag=next
                  npm stage publish "$tarball" --provenance --access public --tag "$tag"

    # A release on GitHub with the changelog entry as its notes, so the tag has a page a reader can
    # land on. Left alone if it exists. Its own job, so writing to the repository and publishing
    # to npm never share one.
    release:
        name: Release on GitHub
        needs: [agree, publish]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The package's name on npm and the way to install it go above the notes. The version
            # is staged on npm, not yet live, so the line says it installs once promoted.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=""
                  [ "$PRERELEASE" = "true" ] && flags="--prerelease"
                  package="$(jq -r .name packages/design-kit/package.json)"
                  export NOTES_LEAD="The kit is [\`$package\`](https://www.npmjs.com/package/$package) on npm. Once this version is promoted there, install it with \`npm install $package@$VERSION\`."
                  scripts/github-release.sh "$TAG" "$VERSION" packages/design-kit/CHANGELOG.md \
                      "design-kit $VERSION" $flags
