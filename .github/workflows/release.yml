name: Release

# Releases the package when a tag such as design-kit-v0.1.0 is pushed. The tag has to name a commit
# on main, match the version in the package's package.json, and have an entry in its changelog, or
# nothing is released. Every check CI runs, runs first.
#
# The publish uses npm's trusted publishing: the workflow proves who it is with an OpenID Connect
# token, so no npm token is stored anywhere, and each version carries provenance that links it to
# the commit and the run that built it. The version is staged, not released. npm holds it until
# Jason promotes it on the package page, so a tag, a green run and a click are all needed before
# anyone can install it, and nothing that happens in CI alone can change what "latest" points at.
# A prerelease version, one with a hyphen, is staged under the "next" tag and marked as a
# prerelease on GitHub.
on:
    push:
        tags:
            - 'design-kit-v*'

permissions:
    contents: read

# One release run for a tag at a time, so a tag pushed again while its run is still going never
# publishes beside it.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The cheap checks first, so a mistyped tag fails in seconds.
    agree:
        name: Tag, version and changelog
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # The tag names the version, the package declares it, and the changelog explains it.
            # All three have to agree, and the commit has to be on main, so nothing unreviewed is
            # ever released.
            - name: Check tag, version, changelog and branch
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  dir=packages/design-kit
                  version="${TAG#design-kit-v}"
                  declared=$(node -p "require('./$dir/package.json').version")
                  if [ "$version" != "$declared" ]; then
                      echo "the tag says $version but $dir/package.json says $declared"
                      exit 1
                  fi
                  if ! grep -qxF -- "## $version" "$dir/CHANGELOG.md"; then
                      echo "$dir/CHANGELOG.md has no entry for $version"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "the tagged commit is not on main"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  case "$version" in
                      *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

    # A called workflow may ask for no more than its caller grants, and CI's deploy job asks for the
    # Pages permissions even though it never runs on a tag, so they are granted here or the run fails
    # at startup.
    checks:
        name: CI
        needs: agree
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            pages: write
            id-token: write

    # The job that can publish does nothing else. It holds the token npm's trusted publishing asks
    # for, so it checks out only the Node version, restores no cache and installs nothing but a
    # pinned npm, without install scripts. What it publishes is the tarball CI packed and proved on
    # the oldest supported Node, in a job with no more than read access, and only when its
    # checksum is the one that job reported.
    publish:
        name: Stage on npm
        needs: [agree, checks]
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        # The environment is what npm's trusted publisher is registered against, and it accepts a
        # deployment only from a design-kit tag.
        environment: npm
        permissions:
            contents: read
            id-token: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            SHA256: ${{ needs.checks.outputs.package-sha256 }}
        steps:
            # The one file the job reads, for the Node the project names. No code is checked out,
            # so none can run.
            - name: Read the Node version
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .nvmrc
                  sparse-checkout-cone-mode: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # Trusted publishing and staging need an npm newer than the runner ships. Pinned, so
            # every release publishes with the same npm, and checked against the checksum npm's
            # registry gives for that version before anything installs it, so this job, which holds
            # the token, runs only that npm. npm bundles its dependencies in that tarball, so the
            # checksum covers them too, and --offline makes the install fail rather than fetch
            # anything the tarball lacks. Dependabot cannot see a version in a script, so it is
            # raised by hand, with its checksum, when npm changes how publishing works.
            - name: Use a pinned npm
              env:
                  NPM_VERSION: 12.2.1
                  NPM_INTEGRITY: sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==
              run: |
                  tarball="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
                  curl -fsSL --retry 3 --retry-all-errors "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz" -o "$tarball"
                  got="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
                  if [ "$got" != "$NPM_INTEGRITY" ]; then
                      echo "npm $NPM_VERSION does not match its pinned checksum"
                      exit 1
                  fi
                  npm install -g --offline --ignore-scripts "$tarball"
                  npm --version

            - name: Download the packed package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: design-kit-package
                  path: ${{ runner.temp }}/package

            # A version already on npm is left alone. A staged version is hidden from npm view
            # until it is promoted, and the token trusted publishing issues cannot list what is
            # staged, so this step cannot tell a version an earlier run staged from one staged from
            # other code, and stops on either rather than guess. A run whose later step failed is
            # repeated with "Re-run failed jobs", which keeps this job's staging and runs only what
            # failed.
            - name: Stage the version on npm with provenance
              run: |
                  page="https://www.npmjs.com/package/@jasonsdevspace/design-kit/v/$VERSION"
                  if npm view "@jasonsdevspace/design-kit@$VERSION" version >/dev/null 2>&1; then
                      echo "$VERSION is already on npm"
                      printf '### On npm\n\n[%s](%s) was already on npm, so nothing was staged.\n' "$VERSION" "$page" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  tarball="$RUNNER_TEMP/package/jasonsdevspace-design-kit-$VERSION.tgz"
                  if [ ! -f "$tarball" ]; then
                      echo "the packed package is not $VERSION"
                      ls "$RUNNER_TEMP/package"
                      exit 1
                  fi
                  # Any job in the run can replace an artifact, but none can change the checksum
                  # the oldest Node check reported, so a swapped tarball stops here.
                  if [ -z "$SHA256" ]; then
                      echo "the checks reported no checksum for the packed package"
                      exit 1
                  fi
                  echo "$SHA256  $tarball" | sha256sum -c -
                  tag=latest
                  [ "$PRERELEASE" = "true" ] && tag=next
                  npm stage publish "$tarball" --provenance --access public --tag "$tag"
                  printf '### Staged on npm\n\n`@jasonsdevspace/design-kit@%s` is staged under the `%s` tag with provenance, and goes live once it is promoted on npm. Its page will be [%s](%s).\n' "$VERSION" "$tag" "$page" "$page" >> "$GITHUB_STEP_SUMMARY"

    # A release on GitHub with the changelog entry as its notes, so the tag has a page a reader can
    # land on. Left alone if it exists. Its own job, so writing to the repository and publishing
    # to npm never share one.
    release:
        name: Release on GitHub
        needs: [agree, publish]
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The package's name on npm and the way to install it go above the notes. The version
            # is staged on npm, not yet live, so the line says it installs once promoted.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=()
                  [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
                  package="$(jq -r .name packages/design-kit/package.json)"
                  export NOTES_LEAD="The kit is [\`$package\`](https://www.npmjs.com/package/$package) on npm. Once this version is promoted there, install it with \`npm install $package@$VERSION\`."
                  scripts/github-release.sh "$TAG" "$VERSION" packages/design-kit/CHANGELOG.md \
                      "design-kit $VERSION" "${flags[@]}"

    # What the release weighs and how the site's pages score, recorded from the tagged commit, which
    # is on main, so the commit each record names is one main keeps. A prerelease records nothing,
    # since main's records describe what a demo installs. This job runs the build and the audit and
    # holds no token that can write, and the records leave it as an artifact. A slow trace on a
    # shared runner can fail it without failing the release, which is already staged.
    records:
        name: Record the release
        needs: [agree, publish]
        if: needs.agree.outputs.prerelease != 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        continue-on-error: true
        permissions:
            contents: read
        outputs:
            ready: ${{ steps.app.outputs.ready }}
        steps:
            - name: Say whether the records app is set up
              id: app
              env:
                  READY: ${{ secrets.RECORDS_APP_CLIENT_ID != '' && secrets.RECORDS_APP_PRIVATE_KEY != '' }}
              run: |
                  echo "ready=$READY" >> "$GITHUB_OUTPUT"
                  if [ "$READY" != "true" ]; then
                      echo "The records were not opened as a pull request, since the records app's secrets are not set." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # The page audit drives Playwright's Chromium, installed as the browser tests install it.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            # The README states the packed size the package record holds, which a test holds it to,
            # so the figure moves with the record.
            - name: Record the package and the pages
              run: |
                  npm run bench:package
                  npm run bench:pages
                  kb="$(node -p "Math.round(require('./docs/benchmarks/package-size.json').size / 1024)")"
                  sed -i -E "s/[0-9]+ KB packed/$kb KB packed/" README.md

            - name: Keep the records
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: records
                  path: |
                      docs/benchmarks/
                      README.md
                  retention-days: 7

    # The records as one pull request, opened with a token from the records app rather than the
    # run's own, since a pull request opened with the run's token starts no workflow, so its
    # required checks would never run. This job installs and runs nothing of the repository's, so
    # the token never meets a dependency's code. A run again moves the branch to the new records
    # and leaves a pull request already open for them as it is.
    records-pull-request:
        name: Open the records
        needs: [agree, records]
        if: needs.records.result == 'success' && needs.records.outputs.ready == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        continue-on-error: true
        permissions:
            contents: read
        env:
            VERSION: ${{ needs.agree.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Take the records
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: records

            - name: Get the records app's token
              id: token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.RECORDS_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RECORDS_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Open a pull request with the records
              env:
                  GH_TOKEN: ${{ steps.token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  branch="records-$VERSION"
                  git config user.name 'jasonsdevspace-records[bot]'
                  git config user.email 'jasonsdevspace-records[bot]@users.noreply.github.com'
                  git switch -c "$branch"
                  git add docs/benchmarks README.md
                  git commit -m "Record the package and the site's pages at $VERSION"
                  git push --force "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$branch"
                  open="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json url -q '.[0].url')"
                  if [ -n "$open" ]; then
                      echo "The records moved to $open." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  echo "The package and the site's pages are recorded again from the commit tagged for $VERSION, which is on main, so the commit each record names is one main keeps. The site's pages draw from the version of the kit the site pinned at that commit." > body.md
                  url="$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
                      --title "Record the package and the site's pages at $VERSION" \
                      --body-file body.md --label documentation --assignee jasonsdevspace)"
                  echo "The records are in $url." >> "$GITHUB_STEP_SUMMARY"
