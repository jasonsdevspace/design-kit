name: Site pages

# Records how the site's pages score whenever the version of the kit the site pins moves on main,
# since the pin is what changes what the pages draw. A release records the package alone, from the
# tagged commit, and the site moves its pin only after that version is promoted, in a pull request
# of its own, so a record taken at the tag would describe a site that was never deployed. This one
# names the version the site pins on main, and is taken again each time that pin moves. A change to
# this workflow runs it too, as a run by hand does, and either records the pages where the record
# on main names another version than the site pins. Only main is recorded, so a run by hand from
# another branch records nothing.
on:
    push:
        branches:
            - main
        paths:
            - packages/site/package.json
            - .github/workflows/site-pages.yml
    workflow_dispatch:

permissions:
    contents: read

# One run at a time, and a run that has started finishes, so no branch is pushed without its pull
# request. A newer push still cancels a run that is waiting its turn, which loses nothing, since
# each run compares the pin with the record rather than with the commit before.
concurrency:
    group: site-pages
    cancel-in-progress: false

jobs:
    # The site's package.json changes for more than its pin, so the record is taken only where the
    # version the site pins differs from the one the record on main names. Comparing with the record
    # rather than the commit before means a run that failed or was stopped is made up by the next.
    # The site pins an exact version, so the record names what the pages drew from, and anything
    # else fails here, before the audit, rather than in a branch name after it. A prerelease pin is
    # not recorded, as the release workflow records none, since main's records describe what a demo
    # installs.
    pin:
        name: Find the site's pin
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            moved: ${{ steps.pin.outputs.moved }}
            version: ${{ steps.pin.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Compare the pin with the record
              id: pin
              run: |
                  now="$(node -p "(require('./packages/site/package.json').dependencies?.['design-kit-release'] ?? '').split('@').pop()")"
                  recorded="$(node -p "const fs = require('fs'), path = './docs/benchmarks/site-pages.json'; fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')).tools?.kit ?? '' : ''")"
                  if ! [[ "$now" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "The site pins '$now', which is not an exact version, so its pages cannot be named by it." >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  echo "version=$now" >> "$GITHUB_OUTPUT"
                  if [[ "$now" == *-* ]]; then
                      echo "moved=false" >> "$GITHUB_OUTPUT"
                      echo "The site pins $now, a prerelease, so its pages are not recorded." >> "$GITHUB_STEP_SUMMARY"
                  elif [ "$now" != "$recorded" ]; then
                      echo "moved=true" >> "$GITHUB_OUTPUT"
                      echo "The site pins $now and the record names ${recorded:-nothing}, so its pages are recorded." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "moved=false" >> "$GITHUB_OUTPUT"
                      echo "The record already names $now, the version the site pins, so its pages are not recorded again." >> "$GITHUB_STEP_SUMMARY"
                  fi

    # The pages recorded from the commit on main that moved the pin. This job runs the build and the
    # audit and names no secret, so no token that can write and no key that mints one is on its
    # runner, and the record leaves it as an artifact. A slow trace
    # on a shared runner can fail it, and a run again, by hand, records the pages then.
    record:
        name: Record the site's pages
        needs: pin
        if: needs.pin.outputs.moved == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # The page audit drives Playwright's Chromium, installed as the browser tests install it.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Record the pages
              run: npm run bench:pages

            - name: Keep the record
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site-pages
                  path: |
                      docs/benchmarks/site-pages.json
                      docs/benchmarks/site-pages.md
                  retention-days: 7

    # The record as a pull request, opened with a token from the records app rather than the run's
    # own, since a pull request opened with the run's token starts no workflow, so its required
    # checks would never run. This job installs and runs nothing of the repository's, so the token
    # never meets a dependency's code. Every record goes on one branch, so a record taken while an
    # earlier one is still open moves that pull request to the newer record and renames it, rather
    # than leaving an older record open to be merged over it.
    record-pull-request:
        name: Open the record
        needs: [pin, record]
        if: needs.record.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        env:
            VERSION: ${{ needs.pin.outputs.version }}
        steps:
            # The app's secrets are read here alone, in the job that installs and runs nothing of
            # the repository's, so a dependency's code never runs beside the key that mints its
            # token.
            - name: Say whether the records app is set up
              id: app
              env:
                  READY: ${{ secrets.RECORDS_APP_CLIENT_ID != '' && secrets.RECORDS_APP_PRIVATE_KEY != '' }}
              run: |
                  echo "ready=$READY" >> "$GITHUB_OUTPUT"
                  if [ "$READY" != "true" ]; then
                      echo "The record was not opened as a pull request, since the records app's secrets are not set." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Checkout
              if: steps.app.outputs.ready == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Take the record
              if: steps.app.outputs.ready == 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site-pages
                  path: docs/benchmarks

            - name: Get the records app's token
              if: steps.app.outputs.ready == 'true'
              id: token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.RECORDS_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RECORDS_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Open a pull request with the record
              if: steps.app.outputs.ready == 'true'
              env:
                  GH_TOKEN: ${{ steps.token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  branch="records-site"
                  title="Record the site's pages with the site pinned to $VERSION"
                  git config user.name 'jasonsdevspace-records[bot]'
                  git config user.email 'jasonsdevspace-records[bot]@users.noreply.github.com'
                  git switch -c "$branch"
                  git add docs/benchmarks/site-pages.json docs/benchmarks/site-pages.md
                  git commit -m "$title"
                  git push --force "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$branch"
                  echo "The site's pages are recorded again from the commit on main that moved the site's pin to $VERSION, so the record names the version the site draws from." > body.md
                  open="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json url -q '.[0].url')"
                  if [ -n "$open" ]; then
                      gh pr edit "$open" --repo "$REPOSITORY" --title "$title" --body-file body.md
                      echo "The record moved to $open." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  url="$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
                      --title "$title" \
                      --body-file body.md --label documentation --assignee jasonsdevspace)"
                  echo "The record is in $url." >> "$GITHUB_STEP_SUMMARY"
