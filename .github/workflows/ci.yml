name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main
# wait their turn.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Lint, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Node version check
              run: npm run node-check

            - name: Unit tests
              run: npm run test:run

            # The package exports the theme module and the plugin from their compiled output, so
            # the build runs here and the next step loads each entry from it.
            - name: Build
              run: npm run build

            # The package as npm packs it, installed into an empty project, where each sheet is
            # found and each module loads by the name a consumer imports it by.
            - name: Install the packed package and load each entry
              run: |
                  npm pack --pack-destination "$RUNNER_TEMP"
                  mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
                  npm init -y > /dev/null
                  npm install --ignore-scripts "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz
                  test -f node_modules/@jasonsdevspace/design-kit/src/tokens.css
                  test -f node_modules/@jasonsdevspace/design-kit/src/base.css
                  node --input-type=module -e "
                      await import('@jasonsdevspace/design-kit/theme');
                      await import('@jasonsdevspace/design-kit/vite');
                  "

    browser:
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Only the browser is downloaded, not the system libraries, within a time of its own,
            # and started once so a library the runner image lacks fails this step rather than a
            # test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Browser tests
              run: npm run e2e

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
