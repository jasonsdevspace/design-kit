name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:
    # The release workflow runs these same checks before it publishes, and publishes only the
    # packed package whose checksum the oldest Node check reports.
    workflow_call:
        outputs:
            package-sha256:
                description: The checksum of the packed package the oldest Node check proved.
                value: ${{ jobs.floor.outputs.sha256 }}

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main wait their turn, so a
# run that has handed the site to Pages is never canceled, which would leave the deployment
# pending.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Lint, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # npm ci installs from the lockfile without comparing it with each workspace's
            # manifest, so a field changed in a package.json, such as its engines, can leave the
            # lockfile behind. Writing the lockfile again changes nothing when the two agree.
            - name: Check the lockfile matches the manifests
              run: |
                  npm install --package-lock-only --ignore-scripts
                  git diff --exit-code package-lock.json

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Node version check
              run: npm run node-check

            - name: Unit tests
              run: npm run test:run

            # The package compiles to what it ships, and the site builds from the version it pins.
            # The oldest Node check builds the package again as it packs, in a job of its own.
            - name: Build
              run: npm run build

    browser:
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Only the browser is downloaded, not the system libraries, within a time of its own,
            # and started once so a library the runner image lacks fails this step rather than a
            # test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Browser tests
              run: npm run e2e

            # The site draws the version of the kit it pins, so a change to the kit is not on the
            # site until it is released. The site's tests run again over this commit's kit, packed
            # and installed under the site's alias without saving it, so a change that breaks the
            # site's audits or its policy fails here, before it is released, not when the pin moves.
            - name: Site tests over this commit's kit
              run: |
                  npm pack --workspace @jasonsdevspace/design-kit --pack-destination "$RUNNER_TEMP"
                  npm install --no-save --ignore-scripts "design-kit-release@file:$(ls "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz)"
                  npx playwright test packages/site

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    # Lighthouse over the built site, held to ShelfLens's gates: accessibility at a hundred, and on a
    # first visit as a slow phone makes it, performance at ninety or more, a good largest paint and
    # no more layout shift than a good visit has.
    lighthouse:
        name: Lighthouse audits
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # The audit drives Playwright's Chromium, installed as the browser tests install it.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Lighthouse audits
              run: npm run lighthouse

    # The package as a page that installs it gets it: packed on the Node the project builds on,
    # checked as a published manifest, and installed into an empty project on the lowest Node its
    # engines field admits.
    floor:
        name: Package on oldest Node
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Packing runs the package's build, which is how the published package is made. Its
            # checksum is a job output, which no other job in the run can change, unlike the
            # artifact, so the release publishes only this tarball.
            - name: Pack the package
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/design-kit --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"

            # The standard check of a published package's manifest: that its exports, types and
            # files point at what the tarball holds.
            - name: Check the package manifest
              run: npx publint packages/design-kit

            # Written as an exact version, because setup-node given a range installs the newest
            # Node in it, the opposite of the oldest. The file is not committed, and its name is
            # not one the Node check reads.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./packages/design-kit/smoke/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/design-kit/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > package-floor
                  echo "FLOOR=$(cat package-floor)" >> "$GITHUB_ENV"

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package-floor

            # Outside the repository, so an import cannot resolve through the workspace's own link
            # to the package, and with install scripts off, as a cautious page installs it.
            - name: Install the packed package into an empty project
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  npm init -y
                  npm pkg set type=module
                  react="$(node -p "require('$GITHUB_WORKSPACE/node_modules/react/package.json').version")"
                  npm install --engine-strict --ignore-scripts "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz "react@$react" "react-dom@$react"
                  smoke="$GITHUB_WORKSPACE/packages/design-kit/smoke"
                  cp "$smoke"/consumer.mjs "$smoke"/exports.mjs "$smoke"/types.ts "$smoke"/tsconfig.nodenext.json "$smoke"/tsconfig.bundler.json .

            # With no Vite installed, which the plugin takes only as an optional peer, and with the
            # React a page that draws the components has.
            - name: Use the package on that Node
              working-directory: ${{ runner.temp }}/consumer
              run: node consumer.mjs

            # As Node and as a bundler resolve them. The plugin's types name Vite's and the
            # components' name React's, so both are installed for this step, as a page that uses
            # them has them.
            - name: Type-check as an installer would
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  types="$(node -p "require('$GITHUB_WORKSPACE/node_modules/@types/react/package.json').version")"
                  npm install --ignore-scripts --no-save "vite@$(node -p "require('$GITHUB_WORKSPACE/node_modules/vite/package.json').version")" "@types/react@$types"
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.nodenext.json
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.bundler.json

            # The same tarball on the Node the project builds on, which the floor does not cover.
            - name: Set up the project's Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Use the package on the project's Node
              working-directory: ${{ runner.temp }}/consumer
              run: FLOOR="$(node -p 'process.versions.node')" node consumer.mjs

            # The release publishes this tarball, now that it is proven, so the job that holds the
            # publish token never installs or builds anything. Kept on every run, so the hand-off is
            # exercised before a release needs it.
            - name: Upload the packed package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: design-kit-package
                  path: ${{ runner.temp }}/jasonsdevspace-design-kit-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

    # The site, published to GitHub Pages at jasonsdevspace.com/design-kit/ once everything above
    # has passed on main, so a merge that fails a check is never deployed. It is built in a job
    # with no more than read access, so nothing the build installs or runs can deploy, and the
    # deploy job runs only GitHub's own Pages actions.
    site:
        name: Build the site
        needs: [verify, browser, lighthouse, floor]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build the site
              run: npm run site

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/site/dist

    deploy:
        name: Deploy the site
        needs: site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
