name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:
    # The release workflow runs these same checks before it publishes, and publishes only the
    # packed package whose checksum the oldest Node check reports.
    workflow_call:
        outputs:
            package-sha256:
                description: The checksum of the packed package the oldest Node check proved.
                value: ${{ jobs.floor.outputs.sha256 }}
            prose-check-sha256:
                description: The checksum of the packed prose check the oldest Node check proved.
                value: ${{ jobs.prose-check-floor.outputs.sha256 }}

permissions:
    contents: read

# Every job reads the cache of installed dependencies and none writes it, so no job that runs a
# test, a lint or a build holds a token that can write what main's runs restore. The dependencies
# workflow alone writes it. A release calls this workflow reading the cache, which asks no more.
cache-mode: read

# A newer push to a pull request supersedes the run in progress. Runs on main wait their turn, so a
# run that has handed the site to Pages is never canceled, which would leave the deployment
# pending.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Lint, test and build
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # npm ci installs from the lockfile without comparing it with each workspace's
            # manifest, so a field changed in a package.json, such as its engines, can leave the
            # lockfile behind. Writing the lockfile again changes nothing when the two agree.
            - name: Check the lockfile matches the manifests
              run: |
                  npm install --package-lock-only --ignore-scripts
                  git diff --exit-code package-lock.json

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Node version check
              run: npm run node-check

            - name: Unit tests
              run: npm run test:run

            # The package compiles to what it ships, and the site builds from the version it pins.
            # The oldest Node check builds the package again as it packs, in a job of its own.
            - name: Build
              run: npm run build

    # The kit's and the site's tests in Chromium, in shards on runners of their own, since the whole
    # run came close to the time limit. The matrix's list alone sets how many, which each shard
    # reads as the strategy's total. The required check is the gate below, so the shards can be
    # named for what they run.
    chromium:
        name: Browser tests in Chromium, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            # Two commits deep, so a pull request's merge and its base, its first parent, can be
            # compared for the files it changes.
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # Only the browser is downloaded, not the system libraries, within a time of its own,
            # and started once so a library the runner image lacks fails this step rather than a
            # test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            # The site's tests against the release it pins run on a push and on a pull request that
            # touches what they read, by the list scripts/site-tests.mjs keeps, the only changes
            # they can find anything new in. The site's tests over this commit's kit run in a job
            # of their own on every change. The run's summary says which, and why.
            - name: Whether the site's tests run here
              id: site
              env:
                  EVENT: ${{ github.event_name }}
              run: |
                  tests="$(node scripts/site-tests.mjs "$EVENT")"
                  echo "tests=$tests" >> "$GITHUB_OUTPUT"
                  if [ "$tests" = skip ]; then
                      echo "The site's tests against its pinned release skip here: this pull request touches nothing they read. They run over this commit's kit in a job of their own." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "The site's tests against its pinned release run here: this is a $EVENT run, or a pull request that touches what they read." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # The totals, and any test that failed, go to the run's summary from the JSON report.
            # The summary reports the tests and never decides them, so the step ends with their
            # status whether or not it could be written. Chromium alone here: the specs that run in
            # WebKit or Firefox as well run there in jobs of their own.
            - name: Browser tests in Chromium
              env:
                  SHARD: ${{ matrix.shard }}
                  SHARDS: ${{ strategy.job-total }}
                  SKIP_SITE: ${{ steps.site.outputs.tests == 'skip' && '1' || '' }}
              run: |
                  rm -f playwright-results.json
                  status=0
                  npm run e2e -- --project chromium --shard "$SHARD/$SHARDS" || status=$?
                  if [ -f playwright-results.json ]; then
                      node scripts/summary.mjs playwright playwright-results.json "Browser tests in Chromium, shard $SHARD of $SHARDS" "$status" ||
                          echo "The summary of the browser tests could not be written."
                  fi
                  exit "$status"

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-chromium-${{ matrix.shard }}
                  path: playwright-report
                  retention-days: 7

    # A job of its own, beside the Chromium shards, so it adds nothing to their time.
    site-kit:
        name: Site tests over this commit's kit
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # Only the browser is downloaded, not the system libraries, within a time of its own,
            # and started once so a library the runner image lacks fails this step rather than a
            # test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            # The site draws the version of the kit it pins, so a change to the kit is not on the
            # site until it is released. The site's tests run again over this commit's kit, packed
            # and installed under the site's alias in the site's own workspace without saving it, so
            # a kit whose version is not the pin's still replaces the release the site resolves, and
            # a check holds what the site resolves to the kit just built. A change that breaks the
            # site's audits or its policy fails here, before it is released, not when the pin moves.
            - name: Site tests over this commit's kit
              run: |
                  npm pack --workspace @jasonsdevspace/design-kit --pack-destination "$RUNNER_TEMP"
                  kit="$(ls "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz)"
                  npm install --no-save --ignore-scripts --workspace packages/site "design-kit-release@file:$kit"
                  node scripts/check-site-kit.mjs "$kit"
                  rm -f playwright-results.json
                  status=0
                  npx playwright test packages/site --project chromium || status=$?
                  if [ -f playwright-results.json ]; then
                      node scripts/summary.mjs playwright playwright-results.json "Site tests over this commit's kit" "$status" ||
                          echo "The summary of the site tests could not be written."
                  fi
                  exit "$status"

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-site-kit
                  path: playwright-report
                  retention-days: 7

    # The check the ruleset requires and the site's build waits on, under the name it always had.
    # It runs whatever the jobs it needs did, and passes only where each of them passed, so a shard
    # that failed, was canceled or was skipped fails it, as does a needed job it heard nothing from.
    browser:
        name: Browser tests
        needs: [chromium, site-kit]
        if: always()
        runs-on: ubuntu-26.04
        timeout-minutes: 2
        steps:
            - name: Every browser job passed
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "The needed jobs ended as: $RESULTS"
                  [ -n "$RESULTS" ] || exit 1
                  for result in $RESULTS; do
                      [ "$result" = success ] || exit 1
                  done

    # The pieces Safari draws its own way, such as a bar that stays put, a height that follows the
    # browser's own bars, a number field's inner room and what a table's frame scrolls to, drawn in
    # its engine too. On a Mac, where WebKit runs on what the image already has: on Ubuntu it needs
    # system packages from a mirror that has been slow enough to run a job out of time. In shards,
    # each on a runner of its own, as many as the matrix lists, one more than Chromium takes, set
    # while each shard ran one worker and two came close to the time limit. They and the job that
    # keeps their dependencies on a push to main are the only jobs on a Mac, so they stay within the
    # Mac runners an account may use at once and none waits for another.
    webkit:
        name: Browser tests in WebKit, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        runs-on: macos-26
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # Started once, so a browser that cannot start fails this step rather than a test.
            - name: Install WebKit
              timeout-minutes: 3
              run: |
                  npx playwright install webkit
                  node -e "require('@playwright/test').webkit.launch({ timeout: 30_000 }).then((b) => b.close())"

            # Two workers, since Playwright's default of half the cores gives the Mac runner's three
            # cores one, where the Ubuntu runners' four give two, and one left the WebKit shards the
            # slowest jobs of the run, near their time limit.
            - name: Browser tests in WebKit
              env:
                  SHARD: ${{ matrix.shard }}
                  SHARDS: ${{ strategy.job-total }}
              run: |
                  rm -f playwright-results.json
                  status=0
                  npm run e2e -- --project webkit --shard "$SHARD/$SHARDS" --workers 2 || status=$?
                  if [ -f playwright-results.json ]; then
                      node scripts/summary.mjs playwright playwright-results.json "Browser tests in WebKit, shard $SHARD of $SHARDS" "$status" ||
                          echo "The summary of the browser tests could not be written."
                  fi
                  exit "$status"

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-webkit-${{ matrix.shard }}
                  path: playwright-report
                  retention-days: 7

    # The stepper, the controls and the pieces in Firefox too, since its number field keeps its spin
    # buttons unless `appearance: textfield` takes them away and it rounds lengths its own way, in
    # the current Firefox Playwright brings rather than the kit's floor. On Ubuntu, as Chromium is,
    # where Firefox starts on what the image already has, which leaves the Mac runners to WebKit. In
    # shards, each on a runner of its own, as many as the matrix lists, one more than Chromium
    # takes, since Firefox runs the specs slower.
    firefox:
        name: Browser tests in Firefox, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # Only the browser is downloaded, not the system libraries, and started once, so a
            # library the runner image lacks fails this step rather than a test.
            - name: Install Firefox
              timeout-minutes: 3
              run: |
                  npx playwright install firefox
                  node -e "require('@playwright/test').firefox.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Browser tests in Firefox
              env:
                  SHARD: ${{ matrix.shard }}
                  SHARDS: ${{ strategy.job-total }}
              run: |
                  rm -f playwright-results.json
                  status=0
                  npm run e2e -- --project firefox --shard "$SHARD/$SHARDS" || status=$?
                  if [ -f playwright-results.json ]; then
                      node scripts/summary.mjs playwright playwright-results.json "Browser tests in Firefox, shard $SHARD of $SHARDS" "$status" ||
                          echo "The summary of the browser tests could not be written."
                  fi
                  exit "$status"

            - name: Keep the report of a failed run
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-firefox-${{ matrix.shard }}
                  path: playwright-report
                  retention-days: 7

    # Lighthouse over the built site, held to ShelfLens's gates: accessibility at a hundred, and on
    # a first visit as a slow phone makes it, performance at ninety or more, a good largest paint
    # and no more layout shift than a good visit has. Each page's script and sheets are held to
    # the site's byte budgets too.
    lighthouse:
        name: Lighthouse audits
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # The installed dependencies the install job kept from main, for this system, its
            # architecture, Node and the lockfile, so only a miss installs here. This job reads the
            # cache and never writes it.
            - name: Restore installed dependencies
              id: deps
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                  key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

            # Without their install scripts, as record 1 says.
            - name: Install dependencies
              if: steps.deps.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            # The audit drives Playwright's Chromium, installed as the browser tests install it.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch({ timeout: 30_000 }).then((b) => b.close())"

            - name: Lighthouse audits
              run: npm run lighthouse

    # The package as a page that installs it gets it: packed on the Node the project builds on,
    # checked as a published manifest, and installed into an empty project on the lowest Node its
    # engines field admits.
    floor:
        name: Package on oldest Node
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says, and afresh from the lockfile, which
            # npm checks each package against, since this job builds what is published or deployed.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Packing runs the package's build, which is how the published package is made. Its
            # checksum is a job output, which no other job in the run can change, unlike the
            # artifact, so the release publishes only this tarball.
            - name: Pack the package
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/design-kit --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"

            # The standard check of a published package's manifest: that its exports, types and
            # files point at what the tarball holds.
            - name: Check the package manifest
              run: npx publint packages/design-kit

            # Written as an exact version, because setup-node given a range installs the newest
            # Node in it, the opposite of the oldest. The file is not committed, and its name is
            # not one the Node check reads.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./packages/design-kit/smoke/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/design-kit/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > package-floor
                  echo "FLOOR=$(cat package-floor)" >> "$GITHUB_ENV"

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package-floor

            # Outside the repository, so an import cannot resolve through the workspace's own link
            # to the package, and with install scripts off, as a cautious page installs it.
            - name: Install the packed package into an empty project
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  npm init -y
                  npm pkg set type=module
                  react="$(node -p "require('$GITHUB_WORKSPACE/node_modules/react/package.json').version")"
                  npm install --engine-strict --ignore-scripts "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz "react@$react" "react-dom@$react"
                  smoke="$GITHUB_WORKSPACE/packages/design-kit/smoke"
                  cp "$smoke"/consumer.mjs "$smoke"/exports.mjs "$smoke"/types.ts "$smoke"/tsconfig.nodenext.json "$smoke"/tsconfig.bundler.json .

            # With no Vite installed, which the plugin takes only as an optional peer, and with the
            # React a page that draws the components has.
            - name: Use the package on that Node
              working-directory: ${{ runner.temp }}/consumer
              run: node consumer.mjs

            # As Node and as a bundler resolve them. The plugin's types name Vite's and the
            # components' name React's, so both are installed for this step, as a page that uses
            # them has them.
            - name: Type-check as an installer would
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  types="$(node -p "require('$GITHUB_WORKSPACE/node_modules/@types/react/package.json').version")"
                  npm install --ignore-scripts --no-save "vite@$(node -p "require('$GITHUB_WORKSPACE/node_modules/vite/package.json').version")" "@types/react@$types"
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.nodenext.json
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.bundler.json

            # The same tarball on the Node the project builds on, which the floor does not cover.
            - name: Set up the project's Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Use the package on the project's Node
              working-directory: ${{ runner.temp }}/consumer
              run: FLOOR="$(node -p 'process.versions.node')" node consumer.mjs

            # The release publishes this tarball, now that it is proven, so the job that holds the
            # publish token never installs or builds anything. Kept on every run, so the hand-off is
            # exercised before a release needs it.
            - name: Upload the packed package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: design-kit-package
                  path: ${{ runner.temp }}/jasonsdevspace-design-kit-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

            # What the tarball that was proved weighs, file by file, raw and gzipped, for the run's
            # summary. It reports the package and never decides it.
            - name: Summarize the package's size
              run: |
                  node scripts/summary.mjs package "$RUNNER_TEMP"/jasonsdevspace-design-kit-*.tgz ||
                      echo "The summary of the package's size could not be written."

    # The site, published to GitHub Pages at jasonsdevspace.com/design-kit/ once everything above
    # has passed on main, so a merge that fails a check is never deployed. It is built in a job
    # with no more than read access, so nothing the build installs or runs can deploy, and the
    # deploy job runs only GitHub's own Pages actions.
    site:
        name: Build the site
        needs: [verify, browser, webkit, firefox, lighthouse, floor]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says, and afresh from the lockfile, which
            # npm checks each package against, since this job builds what is published or deployed.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build the site
              run: npm run site

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/site/dist

    deploy:
        name: Deploy the site
        needs: site
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

            - name: Summarize the deploy
              env:
                  PAGE_URL: ${{ steps.deployment.outputs.page_url }}
              run: |
                  commit="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  printf '### Deployed\n\n%s, from [`%s`](%s).\n' "$PAGE_URL" "${GITHUB_SHA:0:7}" "$commit" >> "$GITHUB_STEP_SUMMARY"

    # The prose check as a repository that installs it gets it: packed on the Node the project
    # builds on, checked as a published manifest, and run on the lowest Node its engines field
    # admits, in an empty git repository of its own, as a command and as a function.
    prose-check-floor:
        name: Prose check on oldest Node
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            # Without their install scripts, as record 1 says, and afresh from the lockfile.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Its checksum is a job output, which no other job in the run can change, unlike the
            # artifact, so a release publishes only this tarball.
            - name: Pack the prose check
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/prose-check --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-prose-check-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"

            # That its exports, types, bin and files point at what the tarball holds.
            - name: Check the package manifest
              run: npx publint packages/prose-check

            # Written as an exact version, because setup-node given a range installs the newest
            # Node in it, the opposite of the oldest. The file is not committed.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./packages/design-kit/smoke/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/prose-check/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > prose-check-floor

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: prose-check-floor

            # Outside the repository, in a git repository of its own, so the command reads only
            # what that repository holds, and with install scripts off, as a repository installs it.
            - name: Install the packed prose check into an empty repository
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  git init --quiet
                  npm init -y
                  npm install --engine-strict --ignore-scripts --save-dev "$RUNNER_TEMP"/jasonsdevspace-prose-check-*.tgz
                  printf 'node_modules/\n' > .gitignore
                  printf 'One sentence. Then another.\n' > README.md

            - name: Pass a repository of plain prose
              working-directory: ${{ runner.temp }}/consumer
              run: ./node_modules/.bin/check-prose

            # The dash is built from its code point, so this file holds none.
            - name: Fail a repository with an em dash in it
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node -e "require('fs').writeFileSync('dashed.md', 'a' + String.fromCodePoint(0x2014) + 'b\n')"
                  if ./node_modules/.bin/check-prose; then
                      echo "the check passed a file with an em dash in it"
                      exit 1
                  fi

            - name: Find one problem in a body given as Markdown
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node --input-type=module -e "
                      import { proseProblems } from '@jasonsdevspace/prose-check';
                      const found = proseProblems('body.md', 'a' + String.fromCodePoint(0x2014) + 'b');
                      if (found.length !== 1) throw new Error('found ' + found.length + ' problems, not one');
                  "

            # A release publishes this tarball, now that it is proven, so the job that holds the
            # publish token never installs or builds anything.
            - name: Upload the packed prose check
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: prose-check-package
                  path: ${{ runner.temp }}/jasonsdevspace-prose-check-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true
